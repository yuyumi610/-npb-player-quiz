/* ===== 2026公式データ自動読み込み =====
   NPB公式の「2026年度シーズン終了時」12球団選手一覧を取得し、
   育成選手を除いた支配下選手をゲームプールへ読み込みます。
   GitHub PagesのブラウザからNPBへ直接アクセスできない場合に備え、
   r.jina.ai の読み取りプロキシを利用します。取得できない場合は内蔵データで動作します。
*/
const OFFICIAL_TEAM_URLS={
  '阪神タイガース':'https://npb.jp/bis/teams/rst_t.html',
  '横浜DeNAベイスターズ':'https://npb.jp/bis/teams/rst_db.html',
  '読売ジャイアンツ':'https://npb.jp/bis/teams/rst_g.html',
  '中日ドラゴンズ':'https://npb.jp/bis/teams/rst_d.html',
  '広島東洋カープ':'https://npb.jp/bis/teams/rst_c.html',
  '東京ヤクルトスワローズ':'https://npb.jp/bis/teams/rst_s.html',
  '福岡ソフトバンクホークス':'https://npb.jp/bis/teams/rst_h.html',
  '北海道日本ハムファイターズ':'https://npb.jp/bis/teams/rst_f.html',
  'オリックス・バファローズ':'https://npb.jp/bis/teams/rst_b.html',
  '東北楽天ゴールデンイーグルス':'https://npb.jp/bis/teams/rst_e.html',
  '埼玉西武ライオンズ':'https://npb.jp/bis/teams/rst_l.html',
  '千葉ロッテマリーンズ':'https://npb.jp/bis/teams/rst_m.html'
};
let officialLoaded=false;
const PROXY='https://r.jina.ai/';
async function fetchOfficial(url){const r=await fetch(PROXY+url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
function cleanName(s){return String(s||'').replace(/【.*?】/g,'').replace(/\[[^\]]*\]\([^)]*\)/g,'').replace(/\s+/g,' ').trim();}
function parseOfficialRoster(md,team){
  const out=[];let pos='';
  const lines=md.split(/\r?\n/);
  for(const raw of lines){
    const line=raw.trim();
    if(/^#+\s*(投手|捕手|内野手|外野手)\s*$/.test(line)) {pos=line.replace(/^#+\s*/,'');continue;}
    if(line.includes('育成選手')) continue;
    const m=line.match(/\[([^\]]+)\]\((https?:\/\/npb\.jp\/bis\/players\/[^)]+)\)/);
    if(!m) continue;
    const name=cleanName(m[1]);
    if(!name || name==='選手一覧') continue;
    const cols=line.split('|').map(x=>x.trim()).filter(Boolean);
    if(cols.length<2) continue;
    const num=cols[0].replace(/[^0-9A-Za-z]+/g,'')||cols[1].match(/^\d+$/)?.[0]||'';
    const rest=cols.slice(1).join('|');
    const profileLink=m[2];
    const born=(rest.match(/(\d{4}\.\d{2}\.\d{2})/)||[])[1]||'';
    const hw=(rest.match(/(\d{3})\s*\|\s*(\d{2,3})/)||[]);
    const height=hw[1]||'';const weight=hw[2]||'';
    const hands=(rest.match(/(右|左)\s*\|\s*(右|左|左右)/)||[]);
    if(!out.some(x=>x.name===name)) out.push({team,league:TEAMS[team],pos:pos||'',num,birth:born,height,weight,throw: hands[1]||'',bat:hands[2]||'',name,profileLink,id:out.length+1,year:2026,career:team,reading:''});
  }
  return out;
}
async function loadOfficialData(){
  if(officialLoaded)return;
  const results=[];
  await Promise.all(Object.entries(OFFICIAL_TEAM_URLS).map(async([team,url])=>{
    try{const md=await fetchOfficial(url);results.push(...parseOfficialRoster(md,team));}catch(e){console.warn('公式データ取得失敗',team,e);}
  }));
  if(results.length>=700){
    results.sort((a,b)=>Object.keys(TEAMS).indexOf(a.team)-Object.keys(TEAMS).indexOf(b.team));
    P=results;rebuildSurnameCounts();officialLoaded=true;
    P.forEach(p=>{if(NAME_READINGS[p.name])p.reading=NAME_READINGS[p.name];});
    $('dataStatus').textContent=`NPB公式データ読み込み済み：${P.length}人（支配下）`;
  }else{
    $('dataStatus').textContent=`公式データを読み込めなかったため内蔵データ（${P.length}人）で開始します。`;
  }
}
async function ensureProfile(p){
  if(p.profileLoaded)return p;
  if(!p.profileLink)return p;
  try{
    const md=await fetchOfficial(p.profileLink);
    p.profileText=md;p.profileLoaded=true;
    const reading=(md.match(new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s+([^\n|]+)'))||[])[1]||'';
    const rm=md.match(/(?:\n|\|)\s*([ぁ-んァ-ヶー・]+)\s*(?:\n|\|)/);
    p.reading=reading.replace(/[・]/g,' ').trim()||rm?.[1]||p.reading;
    const pm=md.match(/ポジション\s*\|\s*([^\n]+)/);if(pm)p.pos=pm[1].trim();
    const hm=md.match(/身長\s*\/\s*体重\s*\|\s*([^\n]+)/);if(hm){const a=hm[1].match(/(\d+)cm\s*\/\s*(\d+)kg/);if(a){p.height=a[1];p.weight=a[2];}}
    const bm=md.match(/生年月日\s*\|\s*([^\n]+)/);if(bm)p.birth=bm[1].trim();
    const em=md.match(/投打\s*\|\s*([^\n]+)/);if(em){const a=em[1].match(/(右|左)投(右|左)打/);if(a){p.throw=a[1];p.bat=a[2];}}
    const cm=md.match(/経歴\s*\|\s*([^\n]+)/);if(cm)p.careerAfterUniversity=cm[1].trim();
    const dm=md.match(/ドラフト\s*\|\s*([^\n]+)/);if(dm)p.draft=dm[1].trim();
    const title=md.match(/タイトル\s*\|\s*([^\n]+)/);if(title)p.title=title[1].trim();
    const lines=md.split(/\r?\n/);
    const idx=lines.findIndex(x=>/\|\s*2026\s*\|/.test(x));
    if(idx>=0){
      const row=lines[idx].split('|').map(x=>x.trim()).filter(Boolean);
      const header=idx>0?lines[idx-1].split('|').map(x=>x.trim()).filter(Boolean):[];
      const val={};header.forEach((h,i)=>{val[h]=row[i]||'';});
      Object.assign(p,val);
    }
  }catch(e){console.warn('選手プロフィール取得失敗',p.name,e);}
  return p;
}
function profileCard(p){
  const items=[
    ['所属球団',p.team],['守備位置',p.pos],['背番号',p.num],['投打',(p.throw&&p.bat)?`${p.throw}投${p.bat}打`:''||'未登録'],
    ['身長',(p.height?`${p.height}cm`:'未登録')],['体重',(p.weight?`${p.weight}kg`:'未登録')],['生年月日',p.birth||'未登録'],
    ['経歴',p.careerAfterUniversity||'未登録'],['ドラフト',p.draft||'未登録'],['球歴',p.career||p.team]
  ];
  return `<div class="result ok" style="text-align:left"><div style="font-size:20px;font-weight:900;margin-bottom:8px">⚾ ${p.name}</div>${items.map(x=>`<div style="padding:3px 0"><b>${x[0]}：</b>${x[1]}</div>`).join('')}</div>`;
}

let mode='all', current=null, hints=0, score=0, q=0, correct=0, answered=false, pool=[], asked=new Set();
const $=id=>document.getElementById(id); const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
const norm=s=>String(s).normalize('NFKC').replace(/[\s　・･.。,，]/g,'').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/神/g,'神').replace(/海/g,'海').toLowerCase();
const hira=s=>String(s).normalize('NFKC').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
const surnameOf=s=>String(s).trim().split(/[\s　]+/)[0];
const kanaName=s=>hira(NAME_READINGS[s]||'');
const surnameKana=s=>hira(kanaName(s)).split(/[\s　]+/)[0];
const normalizedSurname=s=>norm(surnameOf(s));

function refreshTeams(){let sel=$('team');sel.innerHTML='<option value="all">12球団すべて</option>';Object.keys(TEAMS).forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mode=b.dataset.mode;});
function makePool(){let t=$('team').value;pool=P.filter(p=>(mode==='all'||p.league===mode)&&(t==='all'||p.team===t));pool.sort(()=>Math.random()-.5);}
async function start(){await loadOfficialData();makePool();if(!pool.length){alert('該当する選手がいません');return}score=0;q=0;correct=0;show('game');nextQuestion();}
function nextQuestion(){if(q>=20||!pool.length){finish();return}current=pool.pop();q++;hints=0;asked=new Set();answered=false;$('qno').textContent=q;$('score').textContent=score;$('rate').textContent=Math.round(correct/Math.max(1,q-1)*100)+'%';$('bar').style.width=((q-1)/20*100)+'%';$('result').innerHTML='';$('hints').innerHTML='';openedDifficulty={hard:false,normal:false,easy:false};$('nextBtn').disabled=true;$('answer').value='';$('answer').disabled=false;$('answerBtn').disabled=false;$('giveUpBtn').disabled=false;renderHints();renderQuestionButtons();}
const HARD_DEFS=[
 ['pos','守備位置は？'],['birthplace','出身地は？'],['draft','ドラフト順位は？'],
 ['height','身長は？'],['weight','体重は？'],['birthday','生年月日は？'],['hand','投打は？']
];
const NORMAL_COMMON=[
 ['title','獲得タイトルは？'],['highSchool','出身高校は？'],['university','大学は？'],
 ['careerAfterUniversity','大学卒業後の経歴は？'],['career','球歴は？'],['league','所属リーグは？']
];
const BATTER_DEFS=[
 ['games','2026年の試合数は？'],['plateAppearances','2026年の打席数は？'],
 ['hits','2026年の安打数は？'],['batting','2026年の打率は？'],
 ['homeRuns','2026年の本塁打数は？'],['RBI','2026年の打点は？'],['steals','2026年の盗塁数は？']
];
const PITCHER_DEFS=[
 ['appearances','2026年の登板数は？'],['innings','2026年の投球回は？'],
 ['wins','2026年の勝利数は？'],['losses','2026年の敗戦数は？'],
 ['saves','2026年のセーブ数は？'],['holdsPlus','2026年のHP数は？'],
 ['ERA','2026年の防御率は？'],['strikeouts','2026年の奪三振数は？']
];
const EASY_DEFS=[
 ['team','所属球団は？'],['num','背番号は？'],['firstCharacter','名前の最初の文字は？']
];
const CAREER_MAP={
  '甲斐 拓也':'ソフトバンク → 巨人',
  '東浜 巨':'ソフトバンク',
  '尾形 崇斗':'ソフトバンク → DeNA',
  '井上 朋也':'ソフトバンク → DeNA',
  '杉浦 稔大':'日本ハム → 中日',
  '若林 楽人':'巨人 → 西武'
};
P.forEach(p=>{if(CAREER_MAP[p.name])p.career=CAREER_MAP[p.name];p.reading=NAME_READINGS[p.name]||'';});
let surnameCounts={};
function rebuildSurnameCounts(){surnameCounts={};P.forEach(p=>{const k=normalizedSurname(p.name);surnameCounts[k]=(surnameCounts[k]||0)+1;});}
rebuildSurnameCounts();
const allDefs=()=>[...HARD_DEFS,...NORMAL_COMMON,...(current&&current.pos==='投手'?PITCHER_DEFS:BATTER_DEFS),...EASY_DEFS];
let openedDifficulty={hard:false,normal:false,easy:false};
function renderQuestionButtons(){
 const groups=[
  ['hard','質問（ハード）',HARD_DEFS],
  ['normal','質問（ノーマル）',[...(current&&current.pos==='投手'?PITCHER_DEFS:BATTER_DEFS),...NORMAL_COMMON]],
  ['easy','質問（イージー）',EASY_DEFS]
 ];
 $('questionButtons').innerHTML=groups.map(([id,label,defs])=>`
  <div class="difficulty">
   <button type="button" class="difficulty-toggle" data-difficulty="${id}">
    <span>${label}</span><span>${openedDifficulty[id]?'▲':'▼'}</span>
   </button>
   ${openedDifficulty[id]?`<div class="difficulty-body"><div class="qgrid">${defs.map(([k,text])=>`<button type="button" data-q="${k}" ${asked.has(k)||answered?'disabled':''}>${text}</button>`).join('')}</div></div>`:''}
  </div>`).join('');
 document.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.difficulty;openedDifficulty[id]=!openedDifficulty[id];renderQuestionButtons();
 });
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>askQuestion(b.dataset.q));
}
async function answerFor(k){await ensureProfile(current);
 const profileStats={
  games:current['試合']||current.games,plateAppearances:current['打席']||current.plateAppearances,hits:current['安打']||current.hits,batting:current['打率']||current.batting,homeRuns:current['本塁打']||current.homeRuns,RBI:current['打点']||current.RBI,steals:current['盗塁']||current.steals,
  appearances:current['登板']||current.appearances,innings:current['投球回']||current.innings,wins:current['勝利']||current.wins,losses:current['敗北']||current.losses,saves:current['セーブ']||current.saves,holdsPlus:current['HP']||current.holdsPlus,ERA:current['防御率']||current.ERA,strikeouts:current['三振']||current.strikeouts
 };
 if(k in profileStats)return profileStats[k]!==undefined&&profileStats[k]!==''?String(profileStats[k]):'2026年一軍公式戦出場なし';

 const known={
  league:current.league==='central'?'セ・リーグ':'パ・リーグ',
  team:current.team,
  career:current.career || current.team,
  pos:current.pos,
  num:'背番号は'+current.num+'です。',
  firstCharacter:'名前の最初の文字は「'+current.name.replace(/\\s/g,'')[0]+'」です。'
 };
 if(k in known)return known[k];
 const labels=Object.fromEntries([...HARD_DEFS,...NORMAL_COMMON,...BATTER_DEFS,...PITCHER_DEFS].map(x=>[x[0],x[1]]));
 return 'この選手の「'+(labels[k]||k)+'」は、現在のデータに登録されていません。';
}
async function askQuestion(k){
 if(answered||asked.has(k))return;
 asked.add(k);hints++;
 const defs=[...HARD_DEFS,...NORMAL_COMMON,...BATTER_DEFS,...PITCHER_DEFS,...EASY_DEFS];
 const label=defs.find(x=>x[0]===k)?.[1]||k;
 const ans=await answerFor(k);
 $('hints').insertAdjacentHTML('beforeend',`<div class="qaLog"><b>質問：${label}</b><br>${ans}</div>`);
 renderQuestionButtons();
}
function renderHints(){} function hint(){askQuestion('team');}
async function answer(){
 if(answered)return;await ensureProfile(current);
 let a=$('answer').value.trim();
 if(!a){$('result').innerHTML='<div class="result ng">選手名を入力してください。</div>';return;}
 const full=norm(current.name), input=norm(a), fullKana=norm(hira(kanaName(current.name))), inputKana=norm(hira(a));
 let ok=false, ambiguous=false;
 if(input===full || (fullKana && inputKana===fullKana)) ok=true;
 else if(input===normalizedSurname(current.name) || inputKana===surnameKana(current.name)) {
   const cnt=surnameCounts[normalizedSurname(current.name)]||0;
   if(cnt===1) ok=true; else ambiguous=true;
 }
 if(ambiguous){
   $('result').innerHTML='<div class="result ng">「'+surnameOf(current.name)+'」だけでは特定できません。<b>フルネームで答えてください。</b></div>';
   $('answer').focus();return;
 }
 answered=true;
 if(ok){let pts=Math.max(10,100-hints*15);score+=pts;correct++;$('result').innerHTML=`<div class="result ok">正解！ <b>${current.name}</b><br>+${pts}点</div>`;setTimeout(()=>{$('result').insertAdjacentHTML('beforeend',profileCard(current));},0);}
 else{$('result').innerHTML=`<div class="result ng">不正解。正解は <b>${current.name}</b></div>`;setTimeout(()=>{$('result').insertAdjacentHTML('beforeend',profileCard(current));},0);}
 $('score').textContent=score;$('rate').textContent=Math.round(correct/q*100)+'%';$('answer').disabled=true;$('answerBtn').disabled=true;$('giveUpBtn').disabled=true;$('nextBtn').disabled=false;
}
async function giveUp(){
 if(answered)return;await ensureProfile(current);
 answered=true;
 $('result').innerHTML=`<div class="result ng">GIVE UP！正解は <b>${current.name}</b> でした。</div>`+profileCard(current);
 $('answer').disabled=true;$('answerBtn').disabled=true;$('giveUpBtn').disabled=true;
 $('nextBtn').disabled=false;renderQuestionButtons();
}
function finish(){show('finish');$('finalScore').textContent=score;$('finalText').textContent=`20問中 ${correct}問正解（正解率 ${Math.round(correct/Math.max(1,q)*100)}%）`;$('bar').style.width='100%';}
$('startBtn').onclick=start;$('answerBtn').onclick=answer;$('giveUpBtn').onclick=giveUp;$('nextBtn').onclick=nextQuestion;$('backBtn').onclick=()=>show('start');$('againBtn').onclick=()=>show('start');$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});refreshTeams();
