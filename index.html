<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロ野球チップス風 NPB選手当てクイズ</title>
<style>*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#06152e,#123e68 60%,#071a32);font-family:"Yu Gothic",sans-serif;color:#17243a}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.top{text-align:center;color:#fff;padding:25px 12px}
.brand{font-size:30px;font-weight:900;letter-spacing:2px;text-shadow:0 3px 8px #0008}
.sub{font-size:14px;color:#f5d783;letter-spacing:3px;margin-top:8px}.panel{background:#fff;border-radius:0 0 18px 18px;padding:20px;box-shadow:0 8px 24px #0002}
.screen{display:none}
.screen.active{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#c99b35,#f5d783);color:#17243a;border:0;border-radius:12px;padding:13px 20px;font-weight:bold;box-shadow:0 4px 10px #0003}
.btn:active{transform:scale(.97)}
.choice button{
background:#123e68;
color:white;
border:2px solid #d4ad50;
border-radius:12px;
padding:14px;
font-weight:bold;
}
.card{
border:3px solid #d4ad50;
border-radius:16px;
box-shadow:0 8px 20px #0004;
}
.btn{border:0;border-radius:12px;padding:13px 16px;background:#222;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn.red{background:#b5121b}
.btn.gold{background:#b8860b}
.btn.light{background:#eef0f4;color:#222}
.btn:disabled{opacity:.45}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.choice button{padding:14px 8px;border:2px solid #ddd;background:#fff;border-radius:12px;font-weight:800}
.choice button.sel{border-color:#b5121b;background:#fff4f4}
.select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:15px}
.card{margin-top:14px;background:linear-gradient(150deg,#fff,#f4ead0);border:8px solid #d7b65a;border-radius:18px;box-shadow:0 10px 25px #0003;overflow:hidden}
.cardhead{background:#b5121b;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;font-weight:900}
.cardbody{padding:18px}
.hint{border-left:5px solid #b5121b;background:#fff;border-radius:8px;padding:12px;margin:9px 0;box-shadow:0 2px 8px #0001}
.hint small{display:block;color:#777;margin-bottom:3px}
.answer{display:flex;gap:8px;margin-top:14px}
.answer input{flex:1;min-width:0;padding:13px;border:2px solid #bbb;border-radius:10px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#f1f3f6;border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}
.result{margin-top:12px;padding:14px;border-radius:12px;background:#fff5d8}
.ok{background:#eaf8ee}
.ng{background:#fff0f0}
.tiny{font-size:12px;color:#666;line-height:1.6}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:#b5121b;width:0}
.footer{margin-top:14px;font-size:11px;color:#666;text-align:center}
@media(max-width:520px){.choice{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.wrap{padding:9px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="brand">⚾ プロ野球チップス風</div>
<div class="sub">NPB 選手当てクイズ 2026</div>
</div>
<div class="panel">
<section id="start" class="screen active">
<h2>出題範囲を選択</h2>
<div class="choice">
<button data-mode="all" class="sel">12球団</button>
<button data-mode="central">セ・リーグ</button>
<button data-mode="pacific">パ・リーグ</button>
</div>
<label>球団を限定する場合</label>
<select id="team" class="select">
<option value="all">12球団すべて</option>
</select>
<p class="tiny">※2026年NPB公式「支配下選手一覧」を基礎データにした自己完結版。まずは検証済み選手を収録しています。</p>
<button id="startBtn" class="btn red" style="width:100%;margin-top:8px">クイズ開始</button>
</section>

<section id="game" class="screen">
<div class="stats">
<div class="stat"><span>得点</span><b id="score">0</b></div>
<div class="stat"><span>問題</span><b id="qno">1</b></div>
<div class="stat"><span>正解率</span><b id="rate">0%</b></div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="card">
<div class="cardhead"><span id="teamName">TEAM</span><span id="num">--</span></div>
<div class="cardbody">
<div id="hints"></div>
<div class="answer">
<input id="answer" autocomplete="off" placeholder="選手名を入力">
<button id="answerBtn" class="btn red">回答</button>
</div>
<div id="result"></div>
</div>
</div>
<div class="row" style="margin-top:12px">
<button id="hintBtn" class="btn gold">次のヒント</button>
<button id="nextBtn" class="btn light" disabled>次の問題</button>
<button id="backBtn" class="btn light">設定へ戻る</button>
</div>
</section>

<section id="finish" class="screen">
<h2>結果</h2>
<div class="result ok">
<div>最終得点</div>
<div style="font-size:34px;font-weight:900" id="finalScore">0</div>
<div id="finalText"></div>
</div>
<button id="againBtn" class="btn red" style="width:100%;margin-top:14px">もう一度遊ぶ</button>
</section>

<div class="footer">データ基準：NPB公式 2026年度 支配下選手登録一覧 ／ 外部通信なし</div>
</div>
</div>

const $=id=>document.getElementById(id);
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
const norm=s=>String(s).replace(/[\s　・･.。,，]/g,'').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/神/g,'神').replace(/海/g,'海').toLowerCase();

function refreshTeams(){
let sel=$('team');
sel.innerHTML='<option value="all">12球団すべて</option>';
Object.keys(TEAMS).forEach(t=>{
let o=document.createElement('option');
o.value=t;o.textContent=t;sel.appendChild(o);
});
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('sel'));
b.classList.add('sel');mode=b.dataset.mode;
});

function makePool(){
let t=$('team').value;
pool=P.filter(p=>(mode==='all'||p.league===mode)&&(t==='all'||p.team===t));
pool.sort(()=>Math.random()-.5);
}

function start(){
makePool();
if(!pool.length){alert('該当する選手がいません');return}
score=0;q=0;correct=0;show('game');nextQuestion();
}

function nextQuestion(){
if(q>=20||!pool.length){finish();return}
current=pool.pop();q++;hints=0;answered=false;
$('qno').textContent=q;
$('score').textContent=score;
$('rate').textContent=Math.round(correct/Math.max(1,q-1)*100)+'%';
$('bar').style.width=((q-1)/20*100)+'%';
$('teamName').textContent=current.team;
$('num').textContent='背番号 '+current.num;
$('result').innerHTML='';
$('nextBtn').disabled=true;
$('answer').value='';
$('answer').disabled=false;
$('answerBtn').disabled=false;
renderHints();
}

function renderHints(){
let arr=[
['超難問','2026年度のNPB支配下選手'],
['ヒント2','守備位置：'+current.pos],
['ヒント3','球団：'+current.team],
['ヒント4','背番号：'+current.num],
['ヒント5','選手名は '+current.name.replace(/\s/g,'').length+' 文字'],
['最終ヒント','このカードの答えは「'+current.name+'」']
];
$('hints').innerHTML=arr.slice(0,hints+1).map(x=>`<div class="hint"><small>${x[0]}</small>${x[1]}</div>`).join('');
}

function hint(){
if(answered)return;
if(hints<5){hints++;renderHints();}
}

function answer(){
if(answered)return;
let a=$('answer').value.trim();
if(!a){
$('result').innerHTML='<div class="result ng">選手名を入力してください。</div>';
return;
}
answered=true;
let ok=norm(a)===norm(current.name);
if(ok){
let pts=Math.max(10,100-hints*15);
score+=pts;correct++;
$('result').innerHTML=`<div class="result ok">正解！ <b>${current.name}</b><br>+${pts}点</div>`;
}else{
$('result').innerHTML=`<div class="result ng">不正解。正解は <b>${current.name}</b></div>`;
}
$('score').textContent=score;
$('rate').textContent=Math.round(correct/q*100)+'%';
$('answer').disabled=true;
$('answerBtn').disabled=true;
$('nextBtn').disabled=false;
}

function finish(){
show('finish');
$('finalScore').textContent=score;
$('finalText').textContent=`20問中 ${correct}問正解（正解率 ${Math.round(correct/Math.max(1,q)*100)}%）`;
$('bar').style.width='100%';
}

$('startBtn').onclick=start;
$('hintBtn').onclick=hint;
$('answerBtn').onclick=answer;
$('nextBtn').onclick=nextQuestion;
$('backBtn').onclick=()=>show('start');
$('againBtn').onclick=()=>show('start');
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')answer()});
refreshTeams();
</script>
</body>
</html>
